services:
  postgres:
    image: postgres:16-alpine
    container_name: tasker-postgres
    environment:
      - POSTGRES_DB=tasker
      - POSTGRES_USER=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.0-M02-alpine
    container_name: tasker-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
